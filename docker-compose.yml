services:
  service-orquestador:
    build:
      context: ./Orchestrator
      dockerfile: dockerfile
    container_name: service-orquestador
    environment:
      AVAILABILITY_SERVICE_URL: http://service-disponibilidad:8000
      PAYMENTS_SERVICE_URL: http://service-pagos:8000
      DELIVERY_SERVICE_URL: http://service-entrega:8000
    depends_on:
      - service-disponibilidad
      - service-pagos
      - service-entrega
  gateway:
    build: ./gateway
    container_name: api-gateway
    environment:
      BFF_URL: http://bff-web:8000
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN}
    ports:
      - "8000:8000"
    depends_on:
      - bff-web
  bff-web:
    build: ./bff-web
    container_name: bff-web
    environment:
      AVAILABILITY_URL: http://service-disponibilidad:8000
      DELIVERY_URL: http://service-entrega:8000
      ORCHESTRATOR_URL: http://service-orquestador:8000
    depends_on:
      - service-disponibilidad
      - service-entrega
  db-disponibilidad:
    image: postgres:16-alpine
    container_name: db_disponibilidad
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminD
      POSTGRES_DB: Disponibilidad
    volumes:
      - pgdata_disponibilidad:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d Disponibilidad"]
      interval: 5s
      timeout: 5s
      retries: 5

  service-disponibilidad:
    build: ./Disponibilidad
    container_name: service-disponibilidad
    environment:
      DATABASE_URL: postgresql+psycopg://admin:adminD@db-disponibilidad:5432/Disponibilidad
    depends_on:
      db-disponibilidad:
        condition: service_healthy
  db-pagos:
    image: postgres:16-alpine
    container_name: db-pagos
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminP
      POSTGRES_DB: Pagos
    volumes:
      - pgdata_pagos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d Pagos"]
      interval: 5s
      timeout: 5s
      retries: 5

  service-pagos:
    build: ./Pagos
    container_name: service-pagos
    environment:
      DB_USER: admin
      DB_PASSWORD: adminP
      DB_HOST: db-pagos
      DB_PORT: "5432"
      DB_NAME: Pagos
      SIMULATE_GATEWAY_LAG: "false"
      SIMULATE_GATEWAY_DOWN: "false"
    depends_on:
      db-pagos:
        condition: service_healthy

  db-entrega:
    image: postgres:16-alpine
    container_name: db-entrega
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminE
      POSTGRES_DB: Entrega
    volumes:
      - pgdata_entrega:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d Entrega"]
      interval: 5s
      timeout: 5s
      retries: 5

  service-entrega:
    build: ./Entregas
    container_name: service-entrega
    environment:
      DB_USER: admin
      DB_PASSWORD: adminE
      DB_HOST: db-entrega
      DB_PORT: "5432"
      DB_NAME: Entrega
    depends_on:
      db-entrega:
        condition: service_healthy

volumes:
  pgdata_pagos:
  pgdata_entrega:
  pgdata_disponibilidad: